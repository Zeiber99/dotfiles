ecosystem:no_donation_nag = true
autogenerated = 0

# =============================================================================
# 1. VARIABLES GLOBALES Y ENTORNO
# =============================================================================
$mainMod = SUPER
$terminal = foot
$menu = wofi --show drun
env = LIBGL_ALWAYS_SOFTWARE,1

# =============================================================================
# 2. MONITOR
# =============================================================================
monitor=,preferred,auto,1
monitor = Virtual-1, 1920x1080@144, auto, 1
monitor = Virtual-1, 1920x1080@144, auto, 1


# =============================================================================
# 3. TECLADO Y RATÓN
# =============================================================================
input {
    kb_layout = es
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = true
    }
}

# =============================================================================
# 4. ESTÉTICA, DECORACIÓN Y ANIMACIONES
# =============================================================================
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(1a1b26aa)
    layout = dwindle
}

decoration {
    rounding = 12

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = true
    }

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(00000044)
    }
}

animations {
    enabled = yes

    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1

    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
    animation = windowsMove, 1, 5, wind, slide
    animation = border, 1, 1, liner
    animation = fade, 1, 10, default
    animation = workspaces, 1, 5, wind, slide
}

# =============================================================================
# 5. REGLAS DE VENTANAS
# =============================================================================
windowrule = opacity 0.85 0.85, match:class ^(foot)$

# =============================================================================
# 6. AUTO-START (SERVICIOS Y DAEMONS)
# =============================================================================
exec-once = awww-daemon
exec-once = waybar
exec-once = systemctl --user start hyprpolkitagent
exec-once = udiskie --tray &
exec-once = dunst
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = vmware-user



# =============================================================================
# 7. ATAJOS DE TECLADO (BINDS)
# =============================================================================

# --- Sistema y Navegación ---
bind = $mainMod, T, exec, $terminal
bind = $mainMod, M, exit,
bind = $mainMod, Q, killactive,
bind = $mainMod, E, exec, thunar
bind = $mainMod, L, exec, hyprlock

# --- Foco de ventanas (Navegación rápida) ---
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# --- Gestión de ventanas ---
bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, Space, togglefloating

# --- Lanzador de aplicaciones ---
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, R, exec, $menu

# --- Portapapeles ---
bind = $mainMod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy

# --- Capturas de pantalla ---
bind = , PRINT, exec, hyprshot -m region
bind = $mainMod, PRINT, exec, hyprshot -m output

# --- Audio ---
bind = $mainMod SHIFT, A, exec, pavucontrol
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Ajustado a SUPER + ALT para no colisionar con el foco de ventanas
binde = $mainMod ALT, Up, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
binde = $mainMod ALT, Down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

# --- Pantallas, Menú de Salida y Wallpapers ---
bind = $mainMod SHIFT, D, exec, wdisplays
bind = $mainMod SHIFT, E, exec, wlogout

# --- Estética y Temas HyDE ---
bind = $mainMod ALT, T, exec, hyde select theme

# =============================================================================
# 8. GESTIÓN DE ESCRITORIOS VIRTUALES (WORKSPACES)
# =============================================================================
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
