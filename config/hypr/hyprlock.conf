general {
    no_fade_in = false
    disserter = true
}

background {
    monitor =
    # RUTA A TU IMAGEN DE FONDO (IMPORTANTE)
    # Puedes usar la misma que tengas en tu wallpaper
    path = /home/alvaro/Downloads/rosa.jpg   
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 2 # 0 desactiva el desenfoque
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgba(15, 15, 15, 0.0)
    inner_color = rgba(200, 200, 200, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = true
    placeholder_text = <i>Contraseña...</i>
    hide_input = false
    position = 0, -100
    halign = center
    valign = center
}

# RELOJ
label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgba(200, 200, 200, 1.0)
    font_size = 64
    font_family = Noto Sans Semibold
    position = 0, 80
    halign = center
    valign = center
}

# TEXTO DE BIENVENIDA / USUARIO
label {
    monitor =
    text = Hola, Alvaro
    color = rgba(200, 200, 200, 1.0)
    font_size = 20
    font_family = Noto Sans
    position = 0, 30
    halign = center
    valign = center
}

# IMAGEN DE USUARIO (Avatar)
image {
    monitor =
    # RUTA A TU FOTO DE PERFIL REDONDEADA (PNG recomendado)
    path = /home/alvaro/.face.icon 
    size = 100
    border_size = 3
    border_color = rgba(200, 200, 200, 1.0)
    position = 0, -220
    halign = center
    valign = center
}
